<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>页边 · 阅读批注与复盘</title>
  <meta name="description" content="为长期阅读建立项目，写下结构化笔记，让 AI 逐段批阅并记录你的进步。">
  <meta name="theme-color" content="#191611">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="#/">
        <img class="brand-mark" src="icons/logo.svg" alt="">
        <span class="brand-text">
          <b>页边</b>
          <em>阅读批注与复盘</em>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="rail-foot">
        <div class="streak-chip" id="railStreak"></div>
        <p class="rail-note"><span class="dot"></span>数据仅保存在本机浏览器</p>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="lightbox" id="lightbox" hidden>
    <img alt="">
    <button class="lightbox-close" type="button" aria-label="关闭">×</button>
  </div>

  <script>
    /* 兜底：直接用 file:// 双击打开时，浏览器会拦截 ES 模块，页面会一片空白，这里给出说明 */
    (function () {
      function showHint() {
        var main = document.getElementById('main');
        if (!main || main.innerHTML.trim()) return;
        main.innerHTML =
          '<div style="max-width:620px;margin:12vh auto;padding:34px 30px;border:1px solid #DCD2BF;border-radius:14px;background:#FAF6EC;line-height:1.85;color:#2A251D">' +
            '<h1 style="font-size:20px;margin:0 0 8px">需要通过本地服务打开</h1>' +
            '<p style="margin:0 0 18px;color:#6B6152;font-size:14px">浏览器不允许 file:// 页面加载 ES 模块、也不允许使用本地数据库，所以这里是空白。</p>' +
            '<p style="margin:0 0 8px;font-size:14px"><b>方式一</b>：双击同目录的 <code style="background:#EFE7D6;padding:1px 6px;border-radius:4px">start.bat</code>，会自动启动服务并打开页面。</p>' +
            '<p style="margin:0 0 18px;font-size:14px"><b>方式二</b>：部署到 GitHub Pages，直接用网址打开。</p>' +
            '<p style="margin:0;font-size:13px;color:#8A7F6D">若服务已在运行，直接点：' +
              '<a href="http://localhost:8848/index.html" style="color:#B03A2C">http://localhost:8848/index.html</a></p>' +
          '</div>';
      }
      if (location.protocol === 'file:') {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showHint);
        else showHint();
        return;
      }
      /* 其他加载失败的情况：3 秒后仍未渲染出导航，也给提示 */
      window.addEventListener('load', function () {
        setTimeout(function () {
          var nav = document.getElementById('nav');
          if (nav && !nav.children.length) showHint();
        }, 3000);
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
